[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Proxy API calls to Railway backend (avoids CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://socratica-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "20"
