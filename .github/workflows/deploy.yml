name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test -- --forceExit
        env:
          JWT_SECRET: test-secret
