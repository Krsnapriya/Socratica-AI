worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
  access_log  /var/log/nginx/access.log  main;

  sendfile   on;
  gzip       on;
  gzip_types text/plain text/css application/json application/javascript text/javascript;

  server {
    listen 80;
    server_name  _;

    # ─── Static Frontend ───────────────────────────────────────────────────
    root   /usr/share/nginx/html;
    index  index.html workspace.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # ─── API Proxy ─────────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the Express gateway
    location /api/ {
      proxy_pass         http://gateway:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        "";

      # Generous timeout for sandbox executions (max ~15s)
      proxy_read_timeout    20s;
      proxy_connect_timeout  5s;
      proxy_send_timeout    10s;

      # Pass body for POST /api/trace
      client_max_body_size  2m;
    }

    # ─── Health ────────────────────────────────────────────────────────────
    location /health {
      proxy_pass http://gateway:3000/health;
    }

    # ─── Cache static assets ───────────────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
      expires 1d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
  }
}
